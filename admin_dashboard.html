<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PipeSense Admin: Dashboard</title>
  <link rel="icon" type="image/png" href="assets/images/PIPESENSE.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/style.css?v=9">
  <script>
    (function () {
      try {
        var u = JSON.parse(sessionStorage.getItem('pipesense.user'));
        if (!u) location.replace('login.html');
        else if (u.role !== 'admin') location.replace('user_dashboard.html');
      } catch (e) { location.replace('login.html'); }
    })();
  </script>
</head>
<body>

  <div class="boot-error" id="bootError" role="alert" hidden></div>
  <script>
    window.addEventListener('error', function (e) {
      var b = document.getElementById('bootError');
      if (!b) return;
      var file = (e.filename || '').split('/').pop();
      b.textContent = 'PipeSense could not start: ' + (e.message || 'script failed to load') +
        (file ? ' (' + file + ':' + e.lineno + ')' : '');
      b.hidden = false;
    }, true);
  </script>

  <header class="topbar">
    <a class="brand" href="admin_dashboard.html" aria-label="PipeSense admin home">
      <img class="brand-mark" src="assets/images/PIPESENSE.png" alt="" width="44" height="44">
      <span class="brand-name">PipeSense</span>
      <span class="brand-sub">Administrator console</span>
    </a>

    <div class="topbar-actions">
      <button type="button" class="btn btn-accent" id="btnNewReport">Report an issue</button>
      <button type="button" class="btn btn-ghost-light" id="btnAnnounce" hidden>Post announcement</button>
      <div class="auth-area" id="authArea"></div>
    </div>
  </header>

  <main class="app">

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist" aria-label="Panel sections">
        <button type="button" role="tab" class="tab is-active" id="tabDashboard" aria-selected="true" aria-controls="viewDashboard">Dashboard</button>
        <button type="button" role="tab" class="tab" id="tabReports" aria-selected="false" aria-controls="viewReports">Reports</button>
        <button type="button" role="tab" class="tab" id="tabInsights" aria-selected="false" aria-controls="viewInsights">Insights</button>
        <button type="button" role="tab" class="tab" id="tabHistory" aria-selected="false" aria-controls="viewHistory">History</button>
      </div>

      <section class="view" id="viewReports" role="tabpanel" aria-labelledby="tabReports">
        <div class="filters">
          <label class="search">
            <span class="sr-only">Search reports</span>
            <input type="search" id="fSearch" placeholder="Search by title, area, or reporter" autocomplete="off">
          </label>
          <div class="filter-row">
            <label>
              <span class="sr-only">Type</span>
              <select id="fType"></select>
            </label>
            <label>
              <span class="sr-only">Status</span>
              <select id="fStatus"></select>
            </label>
            <label>
              <span class="sr-only">Verification</span>
              <select id="fVerify">
                <option value="">Any verification</option>
                <option value="verified">Verified</option>
                <option value="unverified">Unverified</option>
              </select>
            </label>
          </div>
          <div class="filter-row filter-row-2">
            <label>
              <span class="sr-only">Barangay</span>
              <select id="fArea"></select>
            </label>
            <span></span>
          </div>
          <div class="filter-row filter-row-2">
            <label class="date-field"><span>From</span><input type="date" id="fFrom"></label>
            <label class="date-field"><span>To</span><input type="date" id="fTo"></label>
          </div>
          <div class="result-meta">
            <span id="resultCount" aria-live="polite"></span>
            <button type="button" class="link-btn" id="clearFilters" hidden>Clear filters</button>
          </div>
        </div>
        <ul class="report-list" id="reportList"></ul>
      </section>

      <section class="view" id="viewDetail" role="region" aria-label="Report details" hidden></section>

      <section class="view" id="viewInsights" role="tabpanel" aria-labelledby="tabInsights" hidden></section>

      <section class="view" id="viewHistory" role="tabpanel" aria-labelledby="tabHistory" hidden></section>

      <section class="view" id="viewDashboard" role="tabpanel" aria-labelledby="tabDashboard" hidden></section>
    </aside>

    <section class="mapwrap" aria-label="Water service map">
      <div id="map"></div>

      <div class="map-tools">
        <button type="button" class="chip-btn" id="toggleHotspots" aria-pressed="false">Show frequently affected areas</button>
        <button type="button" class="chip-btn" id="btnPosts">All posts</button>
        <button type="button" class="chip-btn" id="btnLocate">Find my location</button>
      </div>

      <div class="legend" id="legend" aria-label="Map legend"></div>

      <div class="placing-banner" id="placingBanner" role="status" hidden>
        <strong>Tag the location</strong>
        <span>Click the map where the issue is happening.</span>
        <button type="button" class="btn btn-small" id="placeUseMyLocation">Use my location</button>
        <button type="button" class="btn btn-small btn-quiet" id="placeCancel">Cancel</button>
      </div>
    </section>
  </main>

  <dialog id="reportDialog" aria-labelledby="reportTitle">
    <div class="dialog-head">
      <h2 id="reportTitle">Report an issue</h2>
      <button type="button" class="icon-btn" data-close="reportDialog" aria-label="Close">&times;</button>
    </div>

    <form id="reportForm" class="form" novalidate>
      <div class="location-box">
        <div>
          <div class="location-label">Pinned location</div>
          <div id="locText" class="location-text">No pin yet</div>
        </div>
        <button type="button" class="btn btn-small" id="changePin">Change pin</button>
      </div>

      <div class="field-row">
        <label class="field">
          <span>What is happening?</span>
          <select name="type" id="rType" required></select>
        </label>
      </div>

      <label class="field">
        <span>Short title</span>
        <input type="text" name="title" id="rTitleInput" maxlength="90" placeholder="Example: No water since 6 AM" required>
      </label>

      <label class="field">
        <span>Details</span>
        <textarea name="desc" id="rDesc" rows="3" maxlength="500" placeholder="Streets affected, how long it has lasted, anything that helps"></textarea>
      </label>

      <div class="field" id="photoField">
        <span>Photo (optional)</span>
        <input type="file" id="rPhoto" accept="image/jpeg,image/png,image/webp">
        <div id="photoPreview" class="photo-preview"></div>
        <button type="button" class="btn btn-small btn-quiet" id="photoClear" hidden>Remove selected photo</button>
        <label class="check" id="photoRemoveField" hidden>
          <input type="checkbox" id="rPhotoRemove">
          <span>Remove the current photo</span>
        </label>
        <small>JPG, PNG or WebP. It is shown when someone opens the report on the map.</small>
      </div>

      <fieldset class="official-box" id="coverageBox">
        <legend>Affected area</legend>
        <div class="field-row">
          <label class="field">
            <span>Shape</span>
            <select id="rShape">
              <option value="circle">Circle</option>
              <option value="rectangle">Rectangle</option>
              <option value="polygon">Custom shape</option>
            </select>
          </label>
          <label class="field">
            <span>Range</span>
            <select id="rRange"></select>
          </label>
        </div>
        <label class="field" id="circleRow">
          <span>Radius (meters)</span>
          <input type="number" id="rRadius" min="100" max="10000" step="50" value="1000">
        </label>
        <div class="geo-row">
          <button type="button" class="btn btn-small" id="btnDrawArea">Adjust shape on the map</button>
          <small id="geoSummary"></small>
        </div>
        <small id="geoAffected" class="geo-affected"></small>
      </fieldset>

      <label class="field" id="rStatusField" hidden>
        <span>Status</span>
        <select name="status" id="rStatus"></select>
      </label>

      <label class="check" id="codeRedField" hidden>
        <input type="checkbox" id="rCodeRed" name="codeRed">
        <span><strong>Code red.</strong> Email every resident whose home marker is inside this report's affected area.</span>
      </label>

      <fieldset class="official-box" id="officialBox" hidden>
        <legend>Official announcement</legend>
        <label class="check">
          <input type="checkbox" id="rOfficial" name="official">
          <span>Post as an official announcement from the water provider</span>
        </label>
        <div class="field-row" id="scheduleRow">
          <label class="field">
            <span>Starts</span>
            <input type="datetime-local" name="startsAt" id="rStarts">
          </label>
          <label class="field">
            <span>Ends</span>
            <input type="datetime-local" name="endsAt" id="rEnds">
          </label>
        </div>
      </fieldset>

      <p class="form-error" id="reportError" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="btn btn-quiet" data-close="reportDialog">Cancel</button>
        <button type="submit" class="btn btn-primary" id="reportSubmit">Submit report</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    if (!window.L || !window.Swal) {
      var b = document.getElementById('bootError');
      b.textContent = 'A required library (Leaflet map or SweetAlert2) did not load. Check your internet connection and reload.';
      b.hidden = false;
    }
  </script>
  <script src="js/map.js?v=9"></script>
</body>
</html>
