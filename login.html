<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | PipeSense</title>
  <link rel="icon" type="image/png" href="assets/images/PIPESENSE.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/login.css?v=9">
</head>
<body>
  <script>
    function pipesenseBanner(html) {
      var b = document.createElement('div');
      b.className = 'boot-error';
      b.setAttribute('role', 'alert');
      b.innerHTML = html;
      document.body.insertBefore(b, document.body.firstChild);
    }
    window.addEventListener('error', function (e) {
      var file = (e.filename || '').split('/').pop();
      pipesenseBanner('Script error: ' + (e.message || 'unknown') + (file ? ' (' + file + ':' + e.lineno + ')' : ''));
    }, true);
  </script>

  <section class="gate" id="gate" aria-labelledby="gateTitle">
    <div class="gate-art">
      <div class="gate-brand">
        <img class="gate-logo" src="assets/images/PIPESENSE.png" alt="" width="64" height="64">
        <span>PipeSense</span>
      </div>
      <div class="gate-pitch">
        <h2>See what is happening to your water, street by street.</h2>
        <p>Official interruption notices and community reports, together on one map.</p>
      </div>
      <p class="gate-foot">Academic simulation. Not connected to any water utility.</p>
    </div>

    <div class="gate-form">
      <div class="gate-card">
        <a class="link-btn" href="index.html" style="display:inline-block;margin-bottom:14px">&larr; Back to overview</a>
        <h1 id="gateTitle">Log in</h1>
        <p class="gate-lead" id="gateLead">Choose how you are using PipeSense.</p>

        <div class="seg" role="tablist" aria-label="Account type" id="roleSwitch">
          <button type="button" class="seg-btn is-active" id="segResident" role="tab" aria-selected="true">Resident</button>
          <button type="button" class="seg-btn" id="segAdmin" role="tab" aria-selected="false">Administrator</button>
        </div>

        <form id="residentForm" class="form" novalidate>
          <label class="field">
            <span>Username or email</span>
            <input type="text" name="username" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
          <div class="or-divider"><span>New to PipeSense?</span></div>
          <button type="button" class="btn btn-block" id="showSignup">Sign Up</button>
        </form>

        <form id="registerForm" class="form" novalidate hidden>
          <label class="field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" maxlength="30" required>
            <small>3 to 30 letters, numbers, dots, dashes or underscores.</small>
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="new-password" minlength="8" required>
            <small>At least 8 characters.</small>
          </label>
          <label class="field">
            <span>Full name</span>
            <input type="text" name="name" autocomplete="name" maxlength="100" required>
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" maxlength="100" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
          <button type="button" class="btn btn-quiet btn-block" id="backToLogin">Back to log in</button>
        </form>

        <form id="adminForm" class="form" novalidate hidden>
          <label class="field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Log in as administrator</button>
        </form>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/login.js?v=8"></script>
  <script>
    if (!window.__pipesenseLoginReady) {
      pipesenseBanner('<b>login.js</b> did not load, so the buttons cannot work. It must be at <b>js/login.js</b> (next to login.html), then press Ctrl+F5.');
    }
    if (!getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()) {
      pipesenseBanner('<b>base.css</b> did not load. It must be at <b>css/base.css</b>, then press Ctrl+F5.');
    }
  </script>
</body>
</html>
