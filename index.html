<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PipeSense: Water service overview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

  <div class="boot-error" id="bootError" role="alert" hidden></div>
  <script>
    window.addEventListener('error', function (e) {
      var b = document.getElementById('bootError');
      if (!b) return;
      var file = (e.filename || '').split('/').pop();
      b.textContent = 'PipeSense could not start: ' + (e.message || 'script failed to load') +
        (file ? ' (' + file + ':' + e.lineno + ')' : '');
      b.hidden = false;
    }, true);
  </script>

  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="index.html" aria-label="PipeSense home">
        <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <path d="M16 2.5c-5.2 0-9.2 4-9.2 9.1 0 6.6 9.2 17.9 9.2 17.9s9.2-11.300 9.2-17.900c0-5.100-4-9.100-9.200-9.100z" fill="#5CC8D7"/>
          <path d="M11 12.500h6.500a2.500 2.500 0 0 1 2.500 2.500v3.500" fill="none" stroke="#10303B" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="11" cy="12.500" r="1.800" fill="#10303B"/>
        </svg>
        <span class="brand-name">PipeSense</span>
      </a>

      <nav class="public-actions" id="publicActions" aria-label="Account">
        <a class="btn btn-ghost-light" href="login.html" id="btnLogin">Log In</a>
        <a class="btn btn-accent" href="login.html#signup" id="btnSignup">Sign Up</a>
      </nav>
    </div>

    <span class="topbar-note">Public view, read only</span>
  </header>

  <main class="app">

    <aside class="panel" id="panel">
      <div class="ov-head">
        <h1>Water service right now</h1>
        <p>Official advisories and verified community reports across Bacolod City.
           <a href="login.html">Log in</a> to report an issue.</p>
      </div>

      <div class="ov-stats">
        <div class="stat-strip" id="ovStats" aria-live="polite"></div>
      </div>

      <section class="ov-section" aria-labelledby="advTitle">
        <h2 id="advTitle">Advisories <span class="ov-count" id="advCount"></span></h2>
        <ul class="report-list" id="advList"></ul>
      </section>

      <section class="ov-section" aria-labelledby="repTitle">
        <h2 id="repTitle">Reports <span class="ov-count" id="repCount"></span></h2>
        <ul class="report-list" id="repList"></ul>
      </section>
    </aside>

    <section class="mapwrap" aria-label="Water service map preview">
      <div id="map"></div>
      <div class="legend" id="legend" aria-label="Map legend"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    if (!window.L) {
      var b = document.getElementById('bootError');
      b.textContent = 'The Leaflet map library did not load. Check your internet connection and reload.';
      b.hidden = false;
    }
  </script>
  <script src="js/overview.js?v=8"></script>
</body>
</html>
