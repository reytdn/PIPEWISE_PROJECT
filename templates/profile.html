<div class="insights profile">
  <h2>My profile</h2>
  <p class="lead">Update your picture and account details.</p>

  <div class="profile-photo">
    {{{avatar}}}
    <div class="profile-photo-actions">
      <input type="file" id="pAvatarInput" accept="image/jpeg,image/png,image/webp" hidden>
      <button type="button" class="btn btn-small" data-profile="pick">{{#if hasAvatar}}Change picture{{else}}Add picture{{/if}}</button>
      {{#if hasAvatar}}<button type="button" class="btn btn-small btn-quiet btn-danger" data-profile="avatar-remove">Remove</button>{{/if}}
      <small>JPG, PNG or WebP, under 2 MB.</small>
    </div>
  </div>

  <form class="form block" id="pForm" novalidate>
    <h3>Account details</h3>
    <label class="field"><span>Full name</span>
      <input type="text" value="{{name}}" disabled>
    </label>
    <label class="field"><span>Username</span>
      <input type="text" id="pUsername" value="{{username}}" maxlength="30" autocomplete="username">
      <small>3 to 30 letters, numbers, dots, dashes or underscores.</small>
    </label>
    <label class="field"><span>Email (Gmail)</span>
      <input type="text" id="pEmail" value="{{email}}" maxlength="100" autocomplete="email" inputmode="email">
      <small>Password codes and water notices are sent here.</small>
    </label>
    <p class="form-error" id="pError" role="alert" hidden></p>
    <div><button type="submit" class="btn btn-primary" id="pSave">Save changes</button></div>
  </form>

  <div class="block" id="pwBlock">
    <h3>Password</h3>
    <div id="pwStart">
      <p class="lead" style="margin:0 0 10px">To change your password, we email a 6-digit code to {{maskedEmail}} from pipesenseorganization@gmail.com.</p>
      <button type="button" class="btn" data-profile="otp-send" id="pwSendBtn">Send me a code</button>
    </div>
    <form class="form" id="pwForm" hidden novalidate>
      <p class="dialog-note" id="pwNote" role="status"></p>
      <label class="field"><span>6-digit code</span>
        <input type="text" id="pwCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
      </label>
      <label class="field"><span>New password</span>
        <input type="password" id="pwNew" autocomplete="new-password" maxlength="200">
        <small>At least 8 characters.</small>
      </label>
      <label class="field"><span>Confirm new password</span>
        <input type="password" id="pwConfirm" autocomplete="new-password" maxlength="200">
      </label>
      <p class="form-error" id="pwError" role="alert" hidden></p>
      <div class="insight-actions">
        <button type="submit" class="btn btn-primary" id="pwSubmit">Change password</button>
        <button type="button" class="btn" data-profile="otp-send" id="pwResend">Resend code</button>
        <button type="button" class="btn btn-quiet" data-profile="otp-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>
