<p class="lead" style="margin:0 0 6px">{{count}} resolved report{{plural}}.</p>{{#each rows}}
<div class="queue-item" style="--c:{{color}}">
  <button type="button" class="queue-main" data-action="open" data-id="{{id}}">
    <strong>{{title}}</strong>
    <span>{{typeLabel}}. {{when}}</span>
  </button>
  <div class="pills">{{{pills}}}</div>
  <div class="queue-actions">
    <button type="button" class="btn btn-small" data-action="reopen" data-id="{{id}}">Reopen</button>
    <button type="button" class="btn btn-small" data-action="history" data-id="{{id}}">View log</button>
  </div>
</div>{{/each}}{{#if rows}}{{else}}<p class="empty-inline">No resolved reports match.</p>{{/if}}
